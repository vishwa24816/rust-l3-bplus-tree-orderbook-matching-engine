[package]
name = "encfs"
version = "0.1.0"
edition = "2021"
description = "Encrypted virtual loopback filesystem using FUSE + Rust"
license = "MIT"

[dependencies]
libc = "0.2"
argon2 = "0.5"
hkdf = "0.12"
chacha20poly1305 = "0.10"
rand = "0.8"
uuid = { version = "1.0", features = ["v4", "serde"] }
bincode = "1.3"
serde = { version = "1.0", features = ["derive"] }
thiserror = "1.0"
log = "0.4"
env_logger = "0.10"
nix = { version = "0.26", features = ["user"] }
rpassword = "7.0"
sha2 = "0.10"
eframe = "0.27"
egui = "0.27"

[features]
default = []
fuse = ["fuser"]
fuse-integration = ["fuse"]

[dependencies.fuser]
version = "0.14"
optional = true
